<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>레시피 알러지 챗봇</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🍽️ 레시피 알러지 챗봇</h1>
      <p class="subtitle">한국 식약처 기준 22가지 알러지 유발 식품 · 2026 가을&겨울 메뉴 기반</p>
    </header>

    <div class="sidebar">
      <section class="db-section">
        <h2>📋 메뉴 데이터베이스</h2>
        <div id="dbStatus" class="db-status loading">로드 중...</div>
        <ul id="menuList" class="file-list"></ul>
      </section>

      <section class="upload-section">
        <h2>📄 추가 레시피 PDF</h2>
        <label class="upload-label">
          <input type="file" id="pdfInput" accept=".pdf" />
          <span>파일 선택</span>
        </label>
        <button id="uploadBtn" class="btn-primary">업로드</button>
        <div id="uploadStatus" class="status-msg"></div>
      </section>

      <section class="allergen-section">
        <h2>⚠️ 식약처 22종 알러지</h2>
        <div id="allergenTags" class="allergen-tags"></div>
      </section>
    </div>

    <main class="chat-area">
      <div id="chatMessages" class="chat-messages">
        <div class="message bot-message">
          <div class="bubble">
            안녕하세요! <strong>2026 가을·겨울 메뉴</strong>의 알러지 성분을 바로 확인해 드립니다.<br /><br />
            <strong>질문 예시</strong><br />
            · "타르타르 알러지 알려줘"<br />
            · "새우 알러지 손님, 먹을 수 있는 메뉴 추천해줘"<br />
            · "전복리조또에 유제품 들어가?"
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea
          id="chatInput"
          placeholder="메뉴명이나 알러지 관련 질문을 입력하세요..."
          rows="2"
        ></textarea>
        <button id="sendBtn" class="btn-send">전송</button>
      </div>
    </main>
  </div>

  <script>
    let history = [];

    async function loadStatus() {
      const res = await fetch("/status");
      const data = await res.json();

      const dbStatusEl = document.getElementById("dbStatus");
      if (data.menu_db_count > 0) {
        dbStatusEl.textContent = `✅ ${data.menu_db_count}개 메뉴 로드됨`;
        dbStatusEl.className = "db-status ok";
      } else {
        dbStatusEl.textContent = "⚠️ 메뉴 DB 없음";
        dbStatusEl.className = "db-status error";
      }

      // 카테고리별 메뉴 목록
      const menuRes = await fetch("/menus");
      const menus = await menuRes.json();
      const menuList = document.getElementById("menuList");
      const byCategory = {};
      for (const [name, info] of Object.entries(menus)) {
        if (!byCategory[info.category]) byCategory[info.category] = [];
        byCategory[info.category].push({ name, allergens: info.allergens });
      }
      let html = "";
      for (const [cat, items] of Object.entries(byCategory)) {
        html += `<li class="cat-header">${cat}</li>`;
        for (const item of items) {
          const badge = item.allergens.length > 0
            ? `<span class="count-badge">${item.allergens.length}</span>`
            : `<span class="count-badge safe">✓</span>`;
          const shortName = item.name.replace(/^(코스_|단품_|잠실_단품_)/, "");
          html += `<li class="menu-item" title="${item.allergens.join(', ') || '없음'}">${badge} ${shortName}</li>`;
        }
      }
      menuList.innerHTML = html;

      const tagsEl = document.getElementById("allergenTags");
      tagsEl.innerHTML = data.allergens.map((a) => `<span class="tag">${a}</span>`).join("");
    }

    async function uploadPDF() {
      const input = document.getElementById("pdfInput");
      const statusEl = document.getElementById("uploadStatus");
      if (!input.files[0]) {
        statusEl.textContent = "파일을 선택해주세요.";
        statusEl.className = "status-msg error";
        return;
      }
      const formData = new FormData();
      formData.append("file", input.files[0]);
      statusEl.textContent = "업로드 중...";
      statusEl.className = "status-msg loading";
      try {
        const res = await fetch("/upload", { method: "POST", body: formData });
        const data = await res.json();
        statusEl.textContent = res.ok ? data.message : data.detail;
        statusEl.className = res.ok ? "status-msg success" : "status-msg error";
        if (res.ok) await loadStatus();
      } catch {
        statusEl.textContent = "업로드 실패";
        statusEl.className = "status-msg error";
      }
    }

    function appendMessage(role, text, allergens, sources) {
      const container = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.className = `message ${role === "user" ? "user-message" : "bot-message"}`;

      // 마크다운 굵게 처리
      const formatted = text
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br/>");
      let inner = `<div class="bubble">${formatted}</div>`;

      if (allergens && allergens.length > 0) {
        inner += `<div class="allergen-alert">⚠️ 포함 알러지: ${allergens.map((a) => `<span class="alert-tag">${a}</span>`).join(" ")}</div>`;
      }
      if (sources && sources.length > 0) {
        const sourceList = sources.map(s => s.replace(/^(코스_|단품_|잠실_단품_)/, "")).join(", ");
        inner += `<div class="sources">📋 참조 메뉴: ${sourceList}</div>`;
      }

      div.innerHTML = inner;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const msg = input.value.trim();
      if (!msg) return;

      input.value = "";
      appendMessage("user", msg);
      history.push({ role: "user", content: msg });

      const sendBtn = document.getElementById("sendBtn");
      sendBtn.disabled = true;
      sendBtn.textContent = "...";

      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message bot-message";
      loadingDiv.innerHTML = '<div class="bubble typing">답변 생성 중<span>.</span><span>.</span><span>.</span></div>';
      document.getElementById("chatMessages").appendChild(loadingDiv);
      document.getElementById("chatMessages").scrollTop = 99999;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, history: history.slice(-6) }),
        });
        const data = await res.json();
        loadingDiv.remove();
        if (res.ok) {
          appendMessage("bot", data.answer, data.detected_allergens, data.sources);
          history.push({ role: "assistant", content: data.answer });
        } else {
          appendMessage("bot", `오류: ${data.detail}`);
        }
      } catch {
        loadingDiv.remove();
        appendMessage("bot", "서버 연결 오류가 발생했습니다.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "전송";
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("uploadBtn").addEventListener("click", uploadPDF);
    document.getElementById("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    loadStatus();
  </script>
</body>
</html>
